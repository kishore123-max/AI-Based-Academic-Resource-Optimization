services:
  - type: web
    name: campusflow-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campusflow-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: campusflow-db
    databaseName: campusflow
    user: campusflow
